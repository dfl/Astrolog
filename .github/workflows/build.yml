name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install fltk cairo pkg-config

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix fltk)/include -I$(brew --prefix cairo)/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix cairo)/lib"
          cmake --build build --config Release

      - name: Bundle dylibs
        run: |
          brew install dylibbundler
          cd build
          dylibbundler -od -b -x Astrolog.app/Contents/MacOS/Astrolog \
            -d Astrolog.app/Contents/Frameworks/ \
            -p @executable_path/../Frameworks/
          cd ..

      - name: Sign app bundle
        run: |
          # Create entitlements file to disable library validation
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Strip existing signatures from bundled dylibs, then re-sign
          for dylib in build/Astrolog.app/Contents/Frameworks/*.dylib; do
            codesign --remove-signature "$dylib" || true
            codesign --force -s - "$dylib"
          done

          # Sign the main executable with entitlements
          codesign --remove-signature "build/Astrolog.app/Contents/MacOS/Astrolog" || true
          codesign --force --options runtime --entitlements /tmp/entitlements.plist -s - "build/Astrolog.app/Contents/MacOS/Astrolog"

          # Sign the whole bundle
          codesign --force --options runtime --entitlements /tmp/entitlements.plist -s - "build/Astrolog.app"

          # Verify
          codesign -dv --verbose=2 "build/Astrolog.app"
          codesign -d --entitlements :- "build/Astrolog.app"

      - name: Package
        run: |
          # Create zip of app bundle
          cd build
          zip -r "../Astrolog-${{ github.ref_name }}-macos.zip" Astrolog.app
          cd ..

          # Create staging directory for DMG contents
          mkdir -p dmg_contents
          cp -R build/Astrolog.app dmg_contents/

          # Add Applications alias for drag-and-drop install
          ln -s /Applications "dmg_contents/Applications"

          # Create DMG
          hdiutil create -volname "Astrolog" -srcfolder "dmg_contents" \
            -ov -format UDZO "Astrolog-${{ github.ref_name }}-macos.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Astrolog-macos
          path: |
            *.zip
            *.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.dmg
          body: |
            ## macOS Users

            **Installation:**
            1. Download the `.dmg` file
            2. Open the DMG
            3. Drag **Astrolog.app** to the **Applications** folder
            4. Go to Applications, **right-click** Astrolog and select **Open**
            5. Click **Open** in the security dialog

            **Alternative** (Terminal):
            ```
            xattr -rd com.apple.quarantine /Applications/Astrolog.app
            ```
