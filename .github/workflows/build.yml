name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install fltk cairo pkg-config dylibbundler

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_CXX_FLAGS="-I$(brew --prefix fltk)/include -I$(brew --prefix cairo)/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix cairo)/lib"
          cmake --build build --config Release

      - name: Bundle dylibs
        run: |
          cd build
          dylibbundler -od -b -x Astrolog.app/Contents/MacOS/Astrolog \
            -d Astrolog.app/Contents/Frameworks/ \
            -p @executable_path/../Frameworks/
          cd ..

      - name: Upload build
        run: tar czf /tmp/Astrolog-arm64.tar.gz -C build Astrolog.app
      - uses: actions/upload-artifact@v4
        with:
          name: Astrolog-arm64
          path: /tmp/Astrolog-arm64.tar.gz

  build-macos-x86_64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache x86_64 Homebrew
        uses: actions/cache@v4
        id: cache-x86-brew
        with:
          path: /usr/local
          key: brew-x86_64-fltk-cairo-${{ runner.os }}-v1

      - name: Install x86_64 dependencies
        run: |
          arch -x86_64 /bin/bash -c '
            eval "$(/usr/local/bin/brew shellenv 2>/dev/null || true)"
            if ! command -v /usr/local/bin/brew &>/dev/null; then
              /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
            /usr/local/bin/brew install fltk cairo pkg-config
          '

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          arch -x86_64 /bin/bash -c '
            eval "$(/usr/local/bin/brew shellenv)"
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCMAKE_CXX_FLAGS="-I$(/usr/local/bin/brew --prefix fltk)/include -I$(/usr/local/bin/brew --prefix cairo)/include" \
              -DCMAKE_EXE_LINKER_FLAGS="-L$(/usr/local/bin/brew --prefix cairo)/lib"
            cmake --build build --config Release
          '

      - name: Bundle dylibs
        run: |
          brew install dylibbundler
          cd build
          dylibbundler -od -b -x Astrolog.app/Contents/MacOS/Astrolog \
            -d Astrolog.app/Contents/Frameworks/ \
            -p @executable_path/../Frameworks/
          cd ..

      - name: Upload build
        run: tar czf /tmp/Astrolog-x86_64.tar.gz -C build Astrolog.app
      - uses: actions/upload-artifact@v4
        with:
          name: Astrolog-x86_64
          path: /tmp/Astrolog-x86_64.tar.gz

  package-macos-universal:
    runs-on: macos-14
    needs: [build-macos-arm64, build-macos-x86_64]
    steps:
      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: Astrolog-arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: Astrolog-x86_64

      - name: Extract builds
        run: |
          mkdir -p arm64 x86_64
          tar xzf Astrolog-arm64.tar.gz -C arm64
          tar xzf Astrolog-x86_64.tar.gz -C x86_64

      - name: Create universal binary
        run: |
          # Start with the arm64 app as the base (resources are identical)
          mkdir -p universal
          cp -R arm64/Astrolog.app universal/Astrolog.app

          # Merge main executable into universal binary
          lipo -create \
            arm64/Astrolog.app/Contents/MacOS/Astrolog \
            x86_64/Astrolog.app/Contents/MacOS/Astrolog \
            -output universal/Astrolog.app/Contents/MacOS/Astrolog

          # Merge all framework dylibs into universal binaries
          if [ -d "arm64/Astrolog.app/Contents/Frameworks" ]; then
            for dylib in arm64/Astrolog.app/Contents/Frameworks/*.dylib; do
              name=$(basename "$dylib")
              x86_dylib="x86_64/Astrolog.app/Contents/Frameworks/$name"
              if [ -f "$x86_dylib" ]; then
                lipo -create "$dylib" "$x86_dylib" \
                  -output "universal/Astrolog.app/Contents/Frameworks/$name"
              else
                echo "Warning: $name exists in arm64 but not x86_64"
              fi
            done
          fi

          # Verify universal binaries
          echo "=== Main executable ==="
          lipo -info universal/Astrolog.app/Contents/MacOS/Astrolog
          file universal/Astrolog.app/Contents/MacOS/Astrolog
          if [ -d "universal/Astrolog.app/Contents/Frameworks" ]; then
            echo "=== Frameworks ==="
            for dylib in universal/Astrolog.app/Contents/Frameworks/*.dylib; do
              lipo -info "$dylib"
            done
          fi

      - name: Sign universal app
        run: |
          # Create entitlements file to disable library validation
          cat > /tmp/entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Strip and re-sign bundled dylibs
          if [ -d "universal/Astrolog.app/Contents/Frameworks" ]; then
            for dylib in universal/Astrolog.app/Contents/Frameworks/*.dylib; do
              codesign --remove-signature "$dylib" || true
              codesign --force -s - "$dylib"
            done
          fi

          # Sign the main executable with entitlements
          codesign --remove-signature "universal/Astrolog.app/Contents/MacOS/Astrolog" || true
          codesign --force --options runtime --entitlements /tmp/entitlements.plist -s - "universal/Astrolog.app/Contents/MacOS/Astrolog"

          # Sign the whole bundle
          codesign --force --options runtime --entitlements /tmp/entitlements.plist -s - "universal/Astrolog.app"

          # Verify
          codesign -dv --verbose=2 "universal/Astrolog.app"
          codesign -d --entitlements :- "universal/Astrolog.app"

      - name: Package
        run: |
          # Create zip of app bundle
          cd universal
          zip -r "../Astrolog-${{ github.ref_name }}-macos.zip" Astrolog.app
          cd ..

          # Create staging directory for DMG contents
          mkdir -p dmg_contents
          cp -R universal/Astrolog.app dmg_contents/

          # Add Applications alias for drag-and-drop install
          ln -s /Applications "dmg_contents/Applications"

          # Create DMG
          hdiutil create -volname "Astrolog" -srcfolder "dmg_contents" \
            -ov -format UDZO "Astrolog-${{ github.ref_name }}-macos.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Astrolog-macos
          path: |
            *.zip
            *.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.dmg
          body: |
            ## macOS (Universal - Apple Silicon & Intel)

            **Installation:**
            1. Download the `.dmg` file
            2. Open the DMG
            3. Drag **Astrolog.app** to the **Applications** folder
            4. Go to Applications, **right-click** Astrolog and select **Open**
            5. Click **Open** in the security dialog

            **Alternative** (Terminal):
            ```
            xattr -rd com.apple.quarantine /Applications/Astrolog.app
            ```
